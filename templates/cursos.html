{% extends 'base.html' %}

{% block content %}

<h1>Lista de cursos</h1>
<a href="{{url_for('nuevo_curso')}}" class="btn btn-success mb-2">Nuevo</a>
<table class="table table-stiped table-hover">
  <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Descripcion</th>
        <th>horas</th>
        <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    
    {% for item in cursos %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.descripcion}}</td>
        <td>{{ item.horas}}</td>
        <td>
            <a href="{{ url_for('editar_curso', id=item.id) }}" class="btn btn-warning btn">Editar</a>
            <a href= "{{ url_for('eliminar_curso', id=item.id) }}" class="btn btn-danger btn" onclick="return confirm('¿Estás seguro de que quieres eliminar este curso?');">Eliminar</a>
        </td>
    {% endfor %}
    </tr>
  </tbody>
{% endblock %}
